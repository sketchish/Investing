name: Sector tracker

on:
  schedule:
    - cron: "45 12 * * 1-5"   # Mon–Fri 18:15 IST  -> daily candles + daily alerts
    - cron: "15 3 * * 6"      # Saturday 08:45 IST -> weekly review
    - cron: "30 1 1 * *"      # 1st of month 07:00 IST -> all sectors + monthly review
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [daily, weekly, monthly, site]
        default: daily

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide mode
        id: mode
        run: |
          if [ -n "${{ inputs.mode }}" ]; then m="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "15 3 * * 6" ]; then m=weekly
          elif [ "${{ github.event.schedule }}" = "30 1 1 * *" ]; then m=monthly
          else m=daily; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"
          echo "Running mode: $m"

      - name: Run tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python -m tracker.main ${{ steps.mode.outputs.mode }}

      - name: Save new candles and reports
        run: |
          git config user.name "sector-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data reports
          git add -A data reports
          git diff --cached --quiet || git commit -m "Data update (${{ steps.mode.outputs.mode }}) $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
